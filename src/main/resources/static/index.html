<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Calendario de Cuidadoras</title>
</head>
<body>

<div class="container">
  <header>
    <h1>Control de Cuidadoras</h1>
    <div style="display: flex; gap: 10px; align-items: center;">
      <a href="admin.html" class="btn" style="text-decoration: none; background-color: #4f46e5; color: white;">⚙️ Administrar</a>
      <div class="month-nav">
        <button class="btn" id="prev-month">&lt; Anterior</button>
        <span id="current-month-year"></span>
        <button class="btn" id="next-month">Siguiente &gt;</button>
      </div>
    </div>
  </header>
  <div class="main-layout">
    <!-- Calendar Container -->
    <div class="calendar-card">
      <div class="weekdays">
        <div>Dom</div>
        <div>Lun</div>
        <div>Mar</div>
        <div>Mié</div>
        <div>Jue</div>
        <div>Vie</div>
        <div>Sáb</div>
      </div>
      <div class="days-grid" id="calendar-days"></div>
    </div>

    <!-- Calculation Panel -->
    <div class="sidebar">
      <div class="card">
        <h2>Cálculo de Quincena / Mes</h2>
        <div class="form-group">
          <label for="tasa-bcv">Tasa de Cambio BCV (Bs.)</label>
          <input type="number" id="tasa-bcv" class="form-control" value="46.50" step="0.01">
        </div>
        <button class="btn btn-success" style="width: 100%; padding: 12px;" id="btn-calcular">
          Calcular Pagos Automáticos
        </button>

        <div id="results-container" style="display: none; margin-top: 20px;">
          <h3>Resumen de Pagos</h3>
          <table class="results-table">
            <thead>
            <tr>
              <th>Cuidadora</th>
              <th>Días</th>
              <th>Total USD</th>
              <th>Total Bs.</th>
            </tr>
            </thead>
            <tbody id="results-body">
            <!-- Se llenará dinámicamente -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast-msg">Guardado con éxito</div>
<script src="script.js"></script>
</body>
</html>
